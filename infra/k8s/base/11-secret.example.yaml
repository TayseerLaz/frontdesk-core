# TEMPLATE ONLY — copy to 11-secret.yaml, fill in, and DO NOT COMMIT IT.
# (infra/k8s/base/11-secret.yaml is gitignored.)
#
# Better still, don't use this at all: point External Secrets Operator or
# Sealed Secrets at a real vault. The reason this project is being rebuilt is
# that the single copy of these values lived in one file on one machine.
#
# Generate the values:
#   JWT_ACCESS_SECRET / JWT_REFRESH_SECRET   openssl rand -base64 48   (min 32 chars)
#   SECRET_ENCRYPTION_KEY                    openssl rand -hex 32      (EXACTLY 32 bytes)
#   POSTGRES_PASSWORD                        openssl rand -base64 32
#
# ─────────────────────────────────────────────────────────────────────────────
# SECRET_ENCRYPTION_KEY IS NOT REGENERABLE ONCE DATA EXISTS.
# It AES-GCM-encrypts, at rest, every tenant's Meta access token and app
# secret, connector auth configs, Google Calendar refresh tokens and TOTP
# secrets. Restoring a database with a DIFFERENT key does not error at boot —
# it fails later, per tenant, at first decrypt. Back this value up separately
# from the cluster, today.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: platform
type: Opaque
stringData:
  # ---- Required or the pod exits(1) at import time -------------------------
  # DATABASE_URL goes through pgbouncer in transaction mode, so it MUST carry
  # ?pgbouncer=true or Prisma's prepared statements break under the pooler.
  DATABASE_URL: "postgresql://platform:REPLACE_ME@platform-pgbouncer:5432/platform?schema=public&pgbouncer=true"
  # DIRECT_DATABASE_URL bypasses the pooler. Migrations and the RLS applier
  # need it — DDL and SET ROLE do not survive transaction pooling.
  DIRECT_DATABASE_URL: "postgresql://platform:REPLACE_ME@platform-postgres:5432/platform?schema=public"
  REDIS_URL: "redis://platform-redis:6379"
  JWT_ACCESS_SECRET: "REPLACE_ME_min_32_chars"
  JWT_REFRESH_SECRET: "REPLACE_ME_min_32_chars"
  # Required whenever NODE_ENV=production. See the warning above.
  SECRET_ENCRYPTION_KEY: "REPLACE_ME_64_hex_chars"

  POSTGRES_PASSWORD: "REPLACE_ME"

  # ---- Feature credentials: absent means the feature degrades, not a crash --
  WASABI_ACCESS_KEY_ID: ""
  WASABI_SECRET_ACCESS_KEY: ""

  # GROQ_API_KEY is schema-optional but is the sole chat-completion backend:
  # without it the API boots fine and then throws on the first bot message.
  GROQ_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  COHERE_API_KEY: ""

  EMAIL_SMTP_HOST: "email-smtp.us-east-1.amazonaws.com"
  EMAIL_SMTP_PORT: "587"
  EMAIL_SMTP_USER: ""
  EMAIL_SMTP_PASS: ""
  EMAIL_SMTP_SECURE: "false"
  EMAIL_FROM: "the platform <noreply@example.com>"

  GOOGLE_TTS_API_KEY: ""
  ELEVENLABS_API_KEY: ""
  ELEVENLABS_VOICE_ID: ""

  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  MYFATOORAH_API_KEY: ""

  SENTRY_DSN: ""
  PARTNER_PROVISION_SECRET: ""

  # wa-ingest ↔ api shared HMAC secret. Leave EMPTY unless you are deliberately
  # turning on WhatsApp capture: isIngestConfigured() keys off WA_INGEST_URL +
  # WA_INGEST_SECRET, and setting them is what arms the Sales Scan capture path.
  WA_INGEST_SECRET: ""
  # Deliberately a DIFFERENT credential from WA_INGEST_SECRET. Sharing one key
  # would arm sales-scan capture as a side effect of enabling contact sync.
  WA_CONTACTS_SECRET: ""
