apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hader

resources:
  - 00-namespace.yaml
  - 10-config.yaml
  # 11-secret.yaml is intentionally NOT listed — it is gitignored.
  # Create it from 11-secret.example.yaml, or replace it with an
  # ExternalSecret / SealedSecret and list that here instead.
  - 20-postgres.yaml
  - 21-redis.yaml
  - 30-migrate-job.yaml
  - 40-api.yaml
  - 41-worker.yaml
  - 42-web.yaml
  - 50-ingress.yaml
  - 60-backup-cronjob.yaml
  # 43-wa-ingest.yaml is intentionally NOT listed. It does not run in-cluster
  # without a source change (loopback bind), and applying it is what arms the
  # WhatsApp capture path. Add it only as a deliberate decision.

images:
  - name: ghcr.io/tayseerlaz/hader-api
    newTag: latest
  - name: ghcr.io/tayseerlaz/hader-worker
    newTag: latest
  - name: ghcr.io/tayseerlaz/hader-web
    newTag: latest
