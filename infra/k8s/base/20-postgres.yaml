# In-cluster Postgres + pgbouncer.
#
# STRONG RECOMMENDATION: use managed Postgres instead and delete this file.
# A single-replica StatefulSet on one node is not high availability — it is the
# same single point of failure that just cost this project its production box,
# only now with more moving parts. Keep it only if the cluster genuinely is the
# cheapest place to run it, and make sure infra/scripts/backup.sh runs against
# it as a CronJob from day one.
#
# Extensions required by the migrations: citext, pg_trgm, pgcrypto — all ship
# with the stock image. Embeddings are plain Float[] columns, so pgvector is
# NOT needed.
apiVersion: v1
kind: Service
metadata:
  name: platform-postgres
  namespace: platform
spec:
  clusterIP: None
  selector:
    app: platform-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-postgres
  namespace: platform
spec:
  serviceName: platform-postgres
  # Never raise this. Two Postgres pods on one PVC corrupt the data directory.
  replicas: 1
  selector:
    matchLabels:
      app: platform-postgres
  template:
    metadata:
      labels:
        app: platform-postgres
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: platform
            - name: POSTGRES_DB
              value: platform
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_PASSWORD
            # The image only runs initdb when the data dir is empty; pointing
            # at a subdirectory keeps lost+found on the PV from blocking it.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "platform", "-d", "platform"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "platform", "-d", "platform"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { memory: "4Gi" }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
# pgbouncer in TRANSACTION mode. Prisma connects through this for normal
# traffic (DATABASE_URL, with ?pgbouncer=true) but migrations and the RLS
# applier must bypass it (DIRECT_DATABASE_URL) — DDL and SET ROLE do not
# survive transaction pooling.
apiVersion: v1
kind: Service
metadata:
  name: platform-pgbouncer
  namespace: platform
spec:
  selector:
    app: platform-pgbouncer
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-pgbouncer
  namespace: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-pgbouncer
  template:
    metadata:
      labels:
        app: platform-pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - containerPort: 5432
          env:
            - name: DB_HOST
              value: platform-postgres
            - name: DB_NAME
              value: platform
            - name: DB_USER
              value: platform
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_PASSWORD
            - name: POOL_MODE
              value: transaction
            - name: MAX_CLIENT_CONN
              value: "1000"
            - name: DEFAULT_POOL_SIZE
              value: "25"
            - name: AUTH_TYPE
              value: scram-sha-256
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { memory: "256Mi" }
